<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — SmartCampus AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/landing.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box{
    width:100%; max-width:400px; margin:24px;
    border:1px solid var(--line); border-radius:var(--radius-lg);
    background:var(--ink-700); padding:40px 32px; position:relative; z-index:1;
  }
  .login-box h1{ font-size:1.6rem; color:var(--paper); margin-bottom:6px; }
  .login-box .role-tag{ display:inline-block; margin-bottom:24px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-family:var(--font-mono); font-size:0.75rem; color:var(--ash); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
  .field input{
    width:100%; padding:12px 14px; border-radius:10px;
    background:var(--ink-800); border:1px solid var(--line); color:var(--paper); font-family:var(--font-body); font-size:0.95rem;
  }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .login-box .btn{ width:100%; margin-top:8px; }
  .back-link{ display:block; text-align:center; margin-top:20px; color:var(--ash); font-size:0.85rem; }
  .back-link:hover{ color:var(--amber); }
  .placeholder-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:rgba(227,165,61,0.08); border:1px dashed rgba(227,165,61,0.35);
    font-family:var(--font-mono); font-size:0.72rem; color:var(--amber); line-height:1.5;
  }
</style>
</head>
<body>
<div class="bg-grain" aria-hidden="true"></div>

<div class="login-box">
  <span class="eyebrow">SmartCampus AI</span>
  <h1>Staff Portal</h1>
  <span class="role-tag">Sign in to continue</span>

  <form onsubmit="return false;">
    <div class="field">
      <label for="staffId">Staff ID</label>
      <input type="text" id="staffId" placeholder="e.g. STF2026-001" autocomplete="username">
    </div>
    <div class="field">
      <label for="staffPass">Password</label>
      <input type="password" id="staffPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button onclick="gostaffdashboard()" class="btn btn-primary btn-shine">Sign In</button>
  </form>

  <div class="placeholder-note">
    This is a placeholder login screen for today's landing page build. Wire it up to the existing
    Flask authentication route for the Staff module.
  </div>

  <a href="landing.html" class="back-link">← Back to home</a>
</div>

 <script>
        function gostaffdashboard() {
    window.location.href = "staff_dashboard.html";
} // your staff dashboard page
        </script>
</body>
</html>
